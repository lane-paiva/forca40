  &lt;meta name=&quot;description&quot; content=&quot;Treinos curtos de 30 minutos em casa, adaptados à perimenopausa, sem equipamentos iniciais e com substituição imediata para dores articulares.&quot;&gt;
  &lt;style&gt;
    /* ==========================================================================
       DESIGN SYSTEM &amp; TOKENS — FORÇA40+ (Saúde, Vitalidade &amp; Baixo Impacto)
       ========================================================================== */
    :root {
      /* Paleta de Cores (Wellness 40+ — Alto Contraste &amp; Acolhimento) */
      --color-primary: #1B5E54;        /* Deep Forest Teal */
      --color-primary-dark: #13443D;   /* Hover Teal */
      --color-primary-soft: #E8F1EF;   /* Tint suave para badges e ícones */
      --color-accent: #D96B43;         /* Warm Terracotta / Coral (CTA Principal) */
      --color-accent-dark: #B8522E;    /* Hover CTA */
      --color-accent-soft: #FDF0EB;    /* Tint suave terracotta */
      
      --color-bg: #FAF8F5;             /* Areia quente suave */
      --color-surface: #FFFFFF;        /* Branco puro para cards */
      --color-surface-alt: #F3EFEA;    /* Fundo alternativo para respiro */
      
      --color-text: #1E292B;           /* Ardósia escura (contraste &gt; 12:1) */
      --color-text-light: #4A5A5E;     /* Texto secundário (contraste &gt; 6:1) */
      --color-border: #E2DDD5;         /* Borda orgânica sutil */
      --color-success: #1E7E5C;        /* Verde confirmação */

      /* Tipografia (100% System Fonts — Zero requisições externas) */
      --font-body: system-ui, -apple-system, &#39;Segoe UI&#39;, Roboto, Helvetica, Arial, sans-serif;
      --font-heading: Georgia, &#39;Times New Roman&#39;, Times, serif;

      /* Escala Tipográfica */
      --text-xs: 0.8125rem;  /* 13px */
      --text-sm: 0.9375rem;  /* 15px */
      --text-base: 1.0625rem;/* 17px */
      --text-lg: 1.25rem;    /* 20px */
      --text-xl: 1.5rem;     /* 24px */
      --text-2xl: 1.875rem;  /* 30px */
      --text-3xl: 2.375rem;  /* 38px */
      --text-4xl: 3.125rem;  /* 50px */

      /* Layout &amp; Espaçamento */
      --container-width: 1200px;
      --padding-mobile: 20px;
      --padding-desktop: 32px;
      --section-gap-mobile: 64px;
      --section-gap-desktop: 104px;

      /* Bordas &amp; Raios */
      --radius-sm: 8px;
      --radius-md: 16px;
      --radius-lg: 24px;
      --radius-pill: 999px;

      /* Sombras &amp; Motion */
      --shadow-sm: 0 2px 8px rgba(30, 41, 43, 0.05);
      --shadow-md: 0 10px 30px rgba(30, 41, 43, 0.08);
      --shadow-lg: 0 20px 45px rgba(27, 94, 84, 0.12);
      --transition-fast: 250ms ease-in-out;
      --transition-medium: 500ms ease-in-out;
    }

    /* Reset &amp; Base */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
      font-size: 16px;
    }

    body {
      font-family: var(--font-body);
      font-size: var(--text-base);
      line-height: 1.6;
      color: var(--color-text);
      background-color: var(--color-bg);
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    /* Acessibilidade: Focus Visível */
    :focus-visible {
      outline: 3px solid var(--color-accent);
      outline-offset: 3px;
    }

    /* Container &amp; Seções */
    .container {
      max-width: var(--container-width);
      margin: 0 auto;
      padding: 0 var(--padding-mobile);
    }

    @media (min-width: 768px) {
      .container {
        padding: 0 var(--padding-desktop);
      }
    }

    .section {
      padding: var(--section-gap-mobile) 0;
    }

    @media (min-width: 768px) {
      .section {
        padding: var(--section-gap-desktop) 0;
      }
    }

    .section-alt {
      background-color: var(--color-surface-alt);
    }

    /* Cabeçalhos de Seção */
    .section-header {
      text-align: center;
      max-width: 740px;
      margin: 0 auto 48px;
    }

    .eyebrow {
      display: inline-block;
      font-size: var(--text-xs);
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--color-primary);
      background-color: var(--color-primary-soft);
      padding: 6px 14px;
      border-radius: var(--radius-pill);
      margin-bottom: 16px;
    }

    h1, h2, h3 {
      font-family: var(--font-heading);
      color: var(--color-text);
      line-height: 1.2;
      font-weight: 700;
    }

    h2 {
      font-size: var(--text-2xl);
      margin-bottom: 16px;
    }

    @media (min-width: 768px) {
      h2 {
        font-size: var(--text-3xl);
      }
    }

    .section-subtitle {
      font-size: var(--text-base);
      color: var(--color-text-light);
    }

    @media (min-width: 768px) {
      .section-subtitle {
        font-size: var(--text-lg);
      }
    }

    /* ==========================================================================
       BOTÕES (CTA ÚNICO EM TODA A PÁGINA: &quot;Quero treinar sem dor!&quot;)
       ========================================================================== */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      min-height: 54px;
      padding: 14px 30px;
      border-radius: var(--radius-pill);
      font-family: var(--font-body);
      font-size: 1rem;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
      border: 2px solid transparent;
      transition: transform var(--transition-fast), background-color var(--transition-fast), box-shadow var(--transition-fast);
      text-align: center;
    }

    .btn-primary {
      background-color: var(--color-accent);
      color: #FFFFFF;
      box-shadow: 0 6px 20px rgba(217, 107, 67, 0.28);
    }

    .btn-primary:hover {
      background-color: var(--color-accent-dark);
      transform: translateY(-2px) scale(1.02);
      box-shadow: 0 10px 26px rgba(217, 107, 67, 0.36);
    }

    .btn-sm {
      min-height: 44px;
      padding: 10px 20px;
      font-size: 0.9375rem;
    }

    .btn-full {
      width: 100%;
    }

    /* ==========================================================================
       HEADER STICKY GLASSMORPHISM
       ========================================================================== */
    .site-header {
      position: sticky;
      top: 0;
      height: 80px;
      background: rgba(250, 248, 245, 0.86);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--color-border);
      z-index: 100;
      display: flex;
      align-items: center;
    }

    .header-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: var(--color-primary);
      font-family: var(--font-heading);
      font-size: 1.5rem;
      font-weight: 700;
    }

    .brand-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background-color: var(--color-primary);
      color: #FFFFFF;
      font-family: var(--font-body);
      font-size: 0.875rem;
      font-weight: 800;
    }

    .header-nav {
      display: none;
      gap: 28px;
    }

    @media (min-width: 900px) {
      .header-nav {
        display: flex;
      }
    }

    .header-nav a {
      text-decoration: none;
      color: var(--color-text-light);
      font-size: 0.9375rem;
      font-weight: 600;
      transition: color var(--transition-fast);
    }

    .header-nav a:hover {
      color: var(--color-primary);
    }

    /* ==========================================================================
       SEÇÃO 1: HERO (ESQUERDA-DIREITA)
       ========================================================================== */
    .hero {
      padding: 48px 0 64px;
    }

    @media (min-width: 768px) {
      .hero {
        padding: 72px 0 96px;
      }
    }

    .hero-grid {
      display: flex;
      flex-direction: column;
      gap: 40px;
      align-items: center;
    }

    @media (min-width: 768px) {
      .hero-grid {
        flex-direction: row;
        justify-content: space-between;
        gap: 56px;
      }
    }

    .hero-content {
      flex: 1;
      max-width: 600px;
    }

    .hero-title {
      font-size: 2.25rem;

    .metric-value {
      display: block;
      font-family: var(--font-heading);
      font-size: 1.375rem;
      font-weight: 700;
      color: var(--color-primary);
    }

    .metric-label {
      font-size: 0.875rem;
      color: var(--color-text-light);
    }

    .hero-visual {
      flex: 1;
      width: 100%;
      max-width: 520px;
    }

    .hero-card {
      background: linear-gradient(145deg, #FFFFFF 0%, #E8F1EF 100%);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-lg);
      padding: 24px;
      box-shadow: var(--shadow-lg);
      position: relative;
    }

    .hero-illustration {
      width: 100%;

      background: linear-gradient(180deg, #F7F3EC 0%, #E3ECE9 100%);

      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      position: relative;
      overflow: hidden;
      border: 1px solid rgba(27, 94, 84, 0.12);

    .hero-pill-overlay {

      flex-wrap: wrap;
      gap: 8px;
      margin-top: 18px;
      justify-content: center;
    }

    .visual-badge {
      background-color: #FFFFFF;
      color: var(--color-primary);
      border: 1px solid rgba(27, 94, 84, 0.2);
      font-size: 0.8125rem;
      font-weight: 700;
      padding: 6px 12px;
      border-radius: var(--radius-pill);
      box-shadow: var(--shadow-sm);
    }

    .hero-session-preview {
      margin-top: 16px;
      background-color: #FFFFFF;
      border-radius: var(--radius-md);
      padding: 16px;
      border: 1px solid var(--color-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .session-info strong {
      display: block;
      font-size: 0.9375rem;
      color: var(--color-text);
    }

    .session-info span {
      font-size: 0.8125rem;
      color: var(--color-text-light);
    }

    .session-tag {
      background-color: var(--color-accent-soft);
      color: var(--color-accent-dark);
      font-size: 0.75rem;
      font-weight: 700;
      padding: 6px 10px;
      border-radius: var(--radius-sm);
      white-space: nowrap;
    }

    /* ==========================================================================
       SEÇÃO 2: BENEFÍCIOS (3 COLUNAS COM NÚMEROS CONCRETOS)
       ========================================================================== */
    .grid-3 {
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    @media (min-width: 768px) {
      .grid-3 {
        flex-direction: row;
        align-items: stretch;
      }
      .grid-3 &gt; * {
        flex: 1;
      }
    }

    .card {
      background-color: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      padding: 32px 28px;
      box-shadow: var(--shadow-sm);
      transition: transform var(--transition-fast), box-shadow var(--transition-fast);
    }

    .card:hover {
      transform: translateY(-4px);
      box-shadow: var(--shadow-md);
    }

    .icon-box {
      width: 52px;
      height: 52px;
      border-radius: 14px;
      background-color: var(--color-primary-soft);
      color: var(--color-primary);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
    }

    .card h3 {
      font-size: 1.3125rem;
      margin-bottom: 12px;
    }

    .card p {
      color: var(--color-text-light);
      font-size: 1rem;
    }

    /* ==========================================================================
       SEÇÃO 3: PROVA SOCIAL (MÉTRICAS ESPECÍFICAS + DEPOIMENTOS)
       ========================================================================== */
    .proof-banner {
      background-color: var(--color-primary);
      color: #FFFFFF;
      border-radius: var(--radius-lg);
      padding: 32px 24px;
      margin-bottom: 40px;
      display: flex;
      flex-direction: column;
      gap: 24px;
      text-align: center;
    }

    @media (min-width: 768px) {
      .proof-banner {
        flex-direction: row;
        justify-content: space-around;
        padding: 40px 32px;
      }
    }

    .proof-stat-num {
      display: block;
      font-family: var(--font-heading);
      font-size: 2.25rem;
      font-weight: 700;
      color: #FFFFFF;
      line-height: 1.1;
      margin-bottom: 6px;
    }

    .proof-stat-desc {
      font-size: 0.9375rem;
      color: rgba(255, 255, 255, 0.9);
      max-width: 260px;
      margin: 0 auto;
    }

    .testimonial-card {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .stars {
      color: #D96B43;
      font-size: 1.125rem;
      letter-spacing: 2px;
      margin-bottom: 14px;
    }

    .testimonial-quote {
      font-size: 1rem;
      color: var(--color-text);
      margin-bottom: 20px;
      font-style: italic;
    }

    .testimonial-author {
      border-top: 1px solid var(--color-border);
      padding-top: 14px;
      font-size: 0.875rem;
    }

    .testimonial-author strong {
      display: block;
      color: var(--color-text);
      font-size: 0.9375rem;
    }

    .testimonial-author span {
      color: var(--color-primary);
      font-weight: 600;
    }

    /* ==========================================================================
       SEÇÃO 4: COMO FUNCIONA (3 PASSOS HORIZONTAIS COM NÚMEROS GRANDES)
       ========================================================================== */
    .step-card {
      position: relative;
      padding-top: 28px;
    }

    .step-number {
      font-family: var(--font-heading);
      font-size: 3rem;
      font-weight: 700;
      color: rgba(27, 94, 84, 0.18);
      line-height: 1;
      margin-bottom: 12px;
    }

    .step-badge {
      display: inline-block;
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      color: var(--color-accent-dark);
      background-color: var(--color-accent-soft);
      padding: 4px 10px;
      border-radius: var(--radius-pill);
      margin-bottom: 12px;
    }

    .section-cta-center {
      text-align: center;
      margin-top: 44px;
    }

    /* ==========================================================================
       SEÇÃO 5: OFERTA E DIFERENCIAIS (INCLUÍDO VS. O QUE NÃO FAZEMOS)
       ========================================================================== */
    .split-2 {
      display: flex;
      flex-direction: column;
      gap: 28px;
    }

    @media (min-width: 768px) {
      .split-2 {
        flex-direction: row;
        align-items: stretch;
      }
      .split-2 &gt; * {
        flex: 1;
      }
    }

    .checklist {
      list-style: none;
      margin-top: 20px;
    }

    .checklist li {
      position: relative;
      padding-left: 30px;
      margin-bottom: 16px;
      color: var(--color-text);
    }

    .checklist li::before {
      content: &quot;✓&quot;;
      position: absolute;
      left: 0;
      top: 0;
      font-weight: 800;
      color: var(--color-primary);
    }

    .transparency-card {
      background-color: #FFF9F6;
      border: 2px solid #F2D3C6;
    }

    .transparency-card h3 {
      color: var(--color-accent-dark);
    }

    .crosslist {
      list-style: none;
      margin-top: 20px;
    }

    .crosslist li {
      position: relative;
      padding-left: 30px;
      margin-bottom: 16px;
      color: var(--color-text);
    }

    .crosslist li::before {
      content: &quot;✕&quot;;
      position: absolute;
      left: 0;
      top: 0;
      font-weight: 800;
      color: var(--color-accent-dark);
    }

    /* ==========================================================================
       SEÇÃO 6: PLANOS E PREÇOS (2 OPÇÕES LADO A LADO)
       ========================================================================== */
    .pricing-wrapper {
      max-width: 920px;
      margin: 0 auto;
    }

    .plan-card {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
    }

    .plan-featured {
      border: 2px solid var(--color-primary);
      box-shadow: var(--shadow-lg);
    }

    .plan-ribbon {
      position: absolute;
      top: -14px;
      right: 24px;
      background-color: var(--color-primary);
      color: #FFFFFF;
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      padding: 5px 14px;
      border-radius: var(--radius-pill);
    }

    .plan-name {
      font-size: 1.375rem;
      margin-bottom: 8px;
    }

    .plan-price {
      margin: 16px 0 8px;
      display: flex;
      align-items: baseline;
      gap: 4px;
    }

    .plan-currency {
      font-size: 1.125rem;
      font-weight: 700;
      color: var(--color-text);
    }

    .plan-amount {
      font-family: var(--font-heading);
      font-size: 2.75rem;
      font-weight: 700;
      color: var(--color-text);
      line-height: 1;
    }

    .plan-period {
      font-size: 0.9375rem;
      color: var(--color-text-light);
    }

    .plan-note {
      font-size: 0.875rem;
      color: var(--color-primary);
      font-weight: 600;
      margin-bottom: 20px;
    }

    .plan-features {
      list-style: none;
      margin: 20px 0 28px;
      border-top: 1px solid var(--color-border);
      padding-top: 20px;
    }

    .plan-features li {
      padding-left: 26px;
      position: relative;
      margin-bottom: 12px;
      font-size: 0.95rem;
      color: var(--color-text);
    }

    .plan-features li::before {
      content: &quot;✓&quot;;
      position: absolute;
      left: 0;
      color: var(--color-primary);
      font-weight: 700;
    }

    /* ==========================================================================
       SEÇÃO 7: FAQ (ACORDEÃO INTERATIVO — 5 OBJEÇÕES REAIS DA PERSONA)
       ========================================================================== */
    .faq-list {
      max-width: 800px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .faq-item {
      background-color: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      overflow: hidden;
    }

    .faq-question {
      width: 100%;
      background: none;
      border: none;
      padding: 22px 24px;
      text-align: left;
      font-family: var(--font-body);
      font-size: 1.0625rem;
      font-weight: 700;
      color: var(--color-text);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .faq-question:hover {
      color: var(--color-primary);
    }

    .faq-icon {
      font-size: 1.5rem;
      line-height: 1;
      color: var(--color-primary);
      transition: transform var(--transition-fast);
      flex-shrink: 0;
    }

    .faq-item.active .faq-icon {
      transform: rotate(45deg);
    }

    .faq-answer {
      max-height: 0;
      overflow: hidden;
      transition: max-height 350ms ease;
      padding: 0 24px;
      color: var(--color-text-light);
    }

    .faq-item.active .faq-answer {
      max-height: 300px;
      padding-bottom: 22px;
    }

    /* ==========================================================================
       SEÇÃO 8: GARANTIAS (BADGE CENTRALIZADO)
       ========================================================================== */
    .guarantee-box {
      max-width: 820px;
      margin: 0 auto;
      background-color: var(--color-surface);
      border: 2px solid var(--color-primary);
      border-radius: var(--radius-lg);
      padding: 40px 28px;
      text-align: center;
      box-shadow: var(--shadow-md);
    }

        padding: 48px 56px;
      }
    }

    .guarantee-seal {
      width: 76px;
      height: 76px;
      margin: 0 auto 20px;
      border-radius: 50%;
      background-color: var(--color-primary-soft);
      color: var(--color-primary);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-heading);
      font-size: 1.5rem;
      font-weight: 700;
      border: 2px solid var(--color-primary);
    }

    .guarantee-box h2 {
      margin-bottom: 14px;
    }

    .guarantee-box p {
      color: var(--color-text-light);
      max-width: 620px;
      margin: 0 auto 28px;
      font-size: 1.0625rem;
    }

       SEÇÃO 9: FORMULÁRIO DE CONVERSÃO (INSCRIÇÃO RÁPIDA)
       ========================================================================== */
    .form-card {
      max-width: 600px;
      margin: 0 auto;
      background-color: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-lg);
      padding: 36px 24px;
      box-shadow: var(--shadow-lg);
    }

    @media (min-width: 768px) {
      .form-card {
        padding: 44px 40px;
      }

    .form-group {
      margin-bottom: 20px;
    }

    .form-label {
      display: block;
      font-size: 0.9375rem;
      font-weight: 700;
      margin-bottom: 8px;
      color: var(--color-text);
    }

    .form-control {
      width: 100%;
      height: 50px;
      padding: 0 16px;
      border: 1.5px solid var(--color-border);
      border-radius: var(--radius-sm);
      font-family: var(--font-body);
      font-size: 1rem;
      color: var(--color-text);
      background-color: #FFFFFF;
      transition: border-color var(--transition-fast);
    }

    .form-control:focus {
      outline: none;
      border-color: var(--color-primary);
      box-shadow: 0 0 0 3px rgba(27, 94, 84, 0.15);
    }

    .checkbox-group {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      margin-bottom: 24px;
      font-size: 0.875rem;
      color: var(--color-text-light);
    }

    .checkbox-group input {
      margin-top: 4px;
      width: 18px;
      height: 18px;
      accent-color: var(--color-primary);
      flex-shrink: 0;
    }

    .form-feedback {
      display: none;
      margin-top: 20px;
      padding: 18px;
      border-radius: var(--radius-sm);
      background-color: var(--color-primary-soft);
      border: 1px solid var(--color-primary);
      color: var(--color-primary-dark);
      font-size: 0.9375rem;
    }

    .form-feedback.visible {
      display: block;
    }

    /* ==========================================================================
       SEÇÃO 10: CTA FINAL
       ========================================================================== */
    .final-cta-section {
      background-color: var(--color-primary);
      color: #FFFFFF;
      text-align: center;
      padding: 72px 0;
    }

    .final-cta-section h2 {
      color: #FFFFFF;
      max-width: 720px;
      margin: 0 auto 16px;
    }

    .final-cta-section p {
      color: rgba(255, 255, 255, 0.9);
      max-width: 600px;
      margin: 0 auto 32px;
      font-size: 1.125rem;
    }

    /* ==========================================================================
       SEÇÃO 11: RODAPÉ
       ========================================================================== */
    .site-footer {
      background-color: #162224;
      color: rgba(255, 255, 255, 0.78);
      padding: 48px 0 36px;
      font-size: 0.875rem;
    }

    .footer-top {
      display: flex;
      flex-direction: column;
      gap: 24px;
      padding-bottom: 28px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.12);
      margin-bottom: 24px;
    }

    @media (min-width: 768px) {
      .footer-top {
        flex-direction: row;
        justify-content: space-between;
        align-items: center;
      }
    }

    .footer-brand {
      font-family: var(--font-heading);
      font-size: 1.375rem;
      font-weight: 700;
      color: #FFFFFF;
    }

    .footer-links {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
    }

    .footer-links a {
      color: rgba(255, 255, 255, 0.82);
      text-decoration: none;
    }

    .footer-links a:hover {
      color: #FFFFFF;
      text-decoration: underline;
    }

    .footer-disclaimer {
      margin-bottom: 14px;
      line-height: 1.5;
      color: rgba(255, 255, 255, 0.68);
    }

    /* ==========================================================================
       ANIMAÇÃO SUAVE DE SCROLL &amp; SUPORTE A IMPRESSÃO / PDF
       ========================================================================== */
    .reveal {
      opacity: 0;
      transform: translateY(18px);
      transition: opacity var(--transition-medium), transform var(--transition-medium);

      opacity: 1;
      transform: translateY(0);

      }
      .faq-answer {
        max-height: none !important;
        padding-bottom: 18px !important;
      }
      body {
        background-color: #FFFFFF;
      }
    }

              &lt;span&gt;2. Tenho condromalácia ou dor no joelho/lombar. Posso fazer?&lt;/span&gt;
              &lt;span class=&quot;faq-icon&quot; aria-hidden=&quot;true&quot;&gt;+&lt;/span&gt;
            &lt;/button&gt;
            &lt;div class=&quot;faq-answer&quot;&gt;
              &lt;p&gt;
                Se você já tem liberação médica para atividade física leve a moderada, sim. Nossos treinos eliminam saltos e impactos bruscos, priorizando fortalecimento isométrico e amplitude controlada. E, se algum exercício gerar desconforto, basta clicar na opção de substituição articular logo abaixo do vídeo.
              &lt;/p&gt;
            &lt;/div&gt;
          &lt;/div&gt;

          &lt;div class=&quot;faq-item reveal&quot;&gt;
            &lt;button type=&quot;button&quot; class=&quot;faq-question&quot; aria-expanded=&quot;false&quot;&gt;
              &lt;span&gt;3. Preciso comprar halteres, caneleiras ou aparelhos antes de começar?&lt;/span&gt;
              &lt;span class=&quot;faq-icon&quot; aria-hidden=&quot;true&quot;&gt;+&lt;/span&gt;
            &lt;/button&gt;
            &lt;div class=&quot;faq-answer&quot;&gt;
              &lt;p&gt;
                Não. Nas primeiras 4 semanas você utiliza exclusivamente o peso do próprio corpo, uma cadeira firme da sua casa e um tapete ou toalha dobrada. Somente a partir do segundo mês sugerimos, de forma opcional, um par de halteres leves ou faixa elástica.
              &lt;/p&gt;
            &lt;/div&gt;
          &lt;/div&gt;

          &lt;div class=&quot;faq-item reveal&quot;&gt;
            &lt;button type=&quot;button&quot; class=&quot;faq-question&quot; aria-expanded=&quot;false&quot;&gt;
              &lt;span&gt;4. O plano inclui cardápio ou dieta para emagrecer?&lt;/span&gt;
              &lt;span class=&quot;faq-icon&quot; aria-hidden=&quot;true&quot;&gt;+&lt;/span&gt;
            &lt;/button&gt;
            &lt;div class=&quot;faq-answer&quot;&gt;
              &lt;p&gt;
                Não. Não prescrevemos dietas restritivas nem planos alimentares. O Força40+ é focado exclusivamente em ganho de massa magra, força funcional e proteção articular para mulheres 40+.
              &lt;/p&gt;
            &lt;/div&gt;
          &lt;/div&gt;

          &lt;div class=&quot;faq-item reveal&quot;&gt;
            &lt;button type=&quot;button&quot; class=&quot;faq-question&quot; aria-expanded=&quot;false&quot;&gt;
              &lt;span&gt;5. Nos dias em que dormi mal por causa da perimenopausa, consigo adaptar o treino?&lt;/span&gt;

  &lt;!-- ========================================================================
       JAVASCRIPT MÍNIMO INLINE (Scroll Reveal, FAQ Accordion &amp; Pré-seleção)
       ======================================================================== --&gt;
  &lt;script&gt;
    (function () {
      // 1. Scroll Reveal leve com IntersectionObserver
      const revealEls = document.querySelectorAll(&#39;.reveal&#39;);
      if (&#39;IntersectionObserver&#39; in window) {
        const observer = new IntersectionObserver((entries, obs) =&gt; {
          entries.forEach(entry =&gt; {
            if (entry.isIntersecting) {
              entry.target.classList.add(&#39;active&#39;);
              obs.unobserve(entry.target);
            }
          });
        }, { threshold: 0.1, rootMargin: &#39;0px 0px -30px 0px&#39; });

        revealEls.forEach(el =&gt; observer.observe(el));
      } else {
        revealEls.forEach(el =&gt; el.classList.add(&#39;active&#39;));
      }

      // 2. Acordeão FAQ acessível
      document.querySelectorAll(&#39;.faq-question&#39;).forEach(btn =&gt; {
        btn.addEventListener(&#39;click&#39;, () =&gt; {
          const item = btn.parentElement;
          const isOpen = item.classList.contains(&#39;active&#39;);

          document.querySelectorAll(&#39;.faq-item&#39;).forEach(i =&gt; {
            i.classList.remove(&#39;active&#39;);
            const q = i.querySelector(&#39;.faq-question&#39;);
            if (q) q.setAttribute(&#39;aria-expanded&#39;, &#39;false&#39;);
          });

          if (!isOpen) {
            item.classList.add(&#39;active&#39;);
            btn.setAttribute(&#39;aria-expanded&#39;, &#39;true&#39;);
          }
        });
      });

      // 3. Pré-selecionar plano no formulário ao clicar nos cards de preço
      const planSelect = document.getElementById(&#39;plano&#39;);
      document.querySelectorAll(&#39;[data-select-plan]&#39;).forEach(link =&gt; {
        link.addEventListener(&#39;click&#39;, () =&gt; {
          const chosen = link.getAttribute(&#39;data-select-plan&#39;);
          if (planSelect &amp;&amp; chosen) {
            planSelect.value = chosen;
          }
        });
      });

      // 4. Validação e feedback imediato do formulário (sem alert())
      const form = document.getElementById(&#39;lead-form&#39;);
      const feedback = document.getElementById(&#39;form-feedback&#39;);

      if (form &amp;&amp; feedback) {
        form.addEventListener(&#39;submit&#39;, (e) =&gt; {
          e.preventDefault();
          const nome = document.getElementById(&#39;nome&#39;).value.trim();
          const email = document.getElementById(&#39;email&#39;).value.trim();
          const whatsapp = document.getElementById(&#39;whatsapp&#39;).value.trim();
          const lgpd = document.getElementById(&#39;lgpd&#39;).checked;
          const planoTexto = planSelect.options[planSelect.selectedIndex].text;

          if (!nome || !email || !whatsapp || !lgpd) {
            feedback.style.backgroundColor = &#39;#FDF0EB&#39;;
            feedback.style.borderColor = &#39;#D96B43&#39;;
            feedback.style.color = &#39;#9E3D1C&#39;;
            feedback.textContent = &#39;Por favor, preencha seu nome, e-mail, WhatsApp e aceite os termos LGPD para liberar seu acesso.&#39;;
            feedback.classList.add(&#39;visible&#39;);
            return;
          }

          feedback.style.backgroundColor = &#39;#E8F1EF&#39;;
          feedback.style.borderColor = &#39;#1B5E54&#39;;
          feedback.style.color = &#39;#13443D&#39;;
          feedback.innerHTML = &#39;&lt;strong&gt;Pré-inscrição confirmada, &#39; + nome + &#39;!&lt;/strong&gt; Enviamos o link seguro de ativação do &lt;strong&gt;&#39; + planoTexto + &#39;&lt;/strong&gt; para &lt;strong&gt;&#39; + email + &#39;&lt;/strong&gt; e para o seu WhatsApp &lt;strong&gt;&#39; + whatsapp + &#39;&lt;/strong&gt;.&#39;;
          feedback.classList.add(&#39;visible&#39;);
        });
      }
    })();
  &lt;/script&gt;
